name: clean_cleaner
description: "Spotless Solutions — cleaner app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Profile photo — pick from camera or gallery.
  image_picker: ^1.1.2
  # Reads the gitignored .env at runtime.
  flutter_dotenv: ^6.0.1
  # Auth, database and profile-photo storage.
  supabase_flutter: ^2.17.2
  lucide_icons_flutter: ^3.1.20
  url_launcher: ^6.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
  fonts:
    # Same families as the website (public/css/styles.css --font-b / --font-h).
    - family: PublicSans
      fonts:
        - asset: assets/fonts/public-sans-400.ttf
        - asset: assets/fonts/public-sans-500.ttf
          weight: 500
        - asset: assets/fonts/public-sans-600.ttf
          weight: 600
        - asset: assets/fonts/public-sans-700.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/space-grotesk-500.ttf
          weight: 500
        - asset: assets/fonts/space-grotesk-600.ttf
          weight: 600
        - asset: assets/fonts/space-grotesk-700.ttf
          weight: 700
